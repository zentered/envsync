name: Test

on:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  test:
    strategy:
      matrix:
        node-version: ['22.21.0', 24]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run codestyle
      - run: npm test
