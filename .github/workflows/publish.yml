name: Publish

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  pulish:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # - run: npm test
      - run: npx semantic-release
